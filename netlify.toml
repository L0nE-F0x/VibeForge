# The website lives in site/ and is plain HTML, CSS and JS: no build step.
# Setting the base to site/ also keeps Netlify from installing the Electron app's
# dependencies (there is no package.json in site/).
[build]
  base = "site"
  publish = "."
  command = "echo 'static site, nothing to build'"

# `curl -fsSL https://<this site>/install | bash` gets the installer attached to the latest release
# (release.yml), so a change to scripts/install.sh on main reaches people only once it is released.
# curl -L and the in-app Update both follow the redirect.
[[redirects]]
  from = "/install"
  to = "https://github.com/L0nE-F0x/VibeForge/releases/latest/download/install.sh"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # A year of HTTPS-only for this host (Netlify serves it over HTTPS already). Not preloaded:
    # leaving the browsers' preload list again takes months.
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src https://api.github.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
