name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Node 22 is the current LTS and satisfies the README's Node floor (20.19+ or 22.12+, from Vite).
# The Electron binary is not used by npm test or npm run typecheck.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tests, with the core's coverage floor (vitest.config.ts).
      - run: npm run coverage

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bug-shaped rules only (biome.json); nothing is reformatted.
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # The built app, started under a virtual display: every view opens, the language switches,
  # Ctrl+K works and a real shell answers, with no errors from the page (scripts/smoke.mjs).
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # This job runs Electron, so it needs the binary the other jobs skip.
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a --server-args="-screen 0 1600x1000x24" node scripts/smoke.mjs
