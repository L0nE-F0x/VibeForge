name: Nightly

# What CI doesn't check on every pull request, each night on main and on every push to a release
# branch (release/*), so arm64 and drift are caught before a tag rather than by it:
#   - the unit tests on arm64 (ubuntu-24.04-arm) and on the release's own OS (ubuntu-24.04) as
#     well as CI's, each on the newest patch of Node 22, 24 and 26;
#   - the ready-made build packed, installed and smoke-tested on x64 and arm64, as release.yml does;
#   - the dependencies as `npm update` would move them, built and tested in the runner's copy.
# A scheduled run that fails opens an issue labelled nightly-failure, or comments on the open one.
# Run it by hand before a release: gh workflow run nightly.yml --ref <branch>
on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04, ubuntu-24.04-arm]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The newest patch, not the one cached on the runner: Node's own changes show up here first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/syncthing
          key: syncthing-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/syncthing.json') }}
      - run: node scripts/fetch-syncthing.mjs
      - name: Tests, sync-e2e included
        run: node scripts/ci-test.mjs --label nightly-${{ matrix.os }}-node-${{ matrix.node }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports-nightly-${{ matrix.os }}-node-${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: reports/*-attempt-*
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-failures-nightly-${{ matrix.os }}-node-${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: reports/*-failures.json
          if-no-files-found: ignore
          retention-days: 30

  # scripts/build-release.sh on both architectures, as release.yml runs it for a tag (v3.3.0 failed
  # only on arm64, and only there).
  release-build:
    name: release build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
      # As release.yml does: the arm64 image may lack the display and Electron's libraries.
      - name: Ensure Xvfb, zstd and Electron libraries (arm64)
        if: matrix.arch == 'arm64'
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v zstd >/dev/null || ! ldconfig -p | grep -q libgbm.so.1 || ! ldconfig -p | grep -q libasound.so.2; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb zstd libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libatk-bridge2.0-0t64 libdrm2
          fi
      - name: Pack the ready-made build, install it and smoke-test the installed copy
        env:
          SMOKE_ARTIFACTS: ${{ runner.temp }}/evidence/smoke-installed
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" scripts/build-release.sh "$RUNNER_TEMP/release"
      - name: The archive's size
        run: ls -l "$RUNNER_TEMP"/release/vibeforge-*.tar.zst | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: release-build-evidence-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 14

  # Today's versions of everything package.json allows, in this runner's copy only: what the next
  # `npm update` (or Dependabot's) would bring, built, typechecked, linted and tested.
  drift:
    name: dependency drift (npm update)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
      - run: npm ci
      - name: npm update
        run: |
          npm update --no-audit --no-fund
          {
            echo "### What npm update moved"
            echo '```'
            npm ls --depth=0 2>/dev/null || true
            echo '```'
            git diff --stat -- package.json package-lock.json
          } >>"$GITHUB_STEP_SUMMARY"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Tests
        run: node scripts/ci-test.mjs --label drift -- --exclude tests/unit/sync-e2e.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports-drift-attempt-${{ github.run_attempt }}
          path: reports/*-attempt-*
          if-no-files-found: ignore
          retention-days: 14

  # A scheduled run that failed: one open issue collects them, so a red night is never only an email.
  report:
    name: report a failed night
    needs: [test, release-build, drift]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.release-build.result }}
          DRIFT: ${{ needs.drift.result }}
        run: |
          body="The nightly checks on main failed on $(date -u +%F): unit tests $TEST, release build $BUILD, dependency drift $DRIFT. $RUN_URL"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly-failure --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh label create nightly-failure --repo "$GITHUB_REPOSITORY" --color b60205 --description "The nightly checks failed" --force
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly checks failed" --label nightly-failure --body "$body"
          fi
