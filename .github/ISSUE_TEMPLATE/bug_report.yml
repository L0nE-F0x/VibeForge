name: Report a bug
description: Something in VibeForge doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Help → Report a bug** inside VibeForge fills in the version details below for you.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
      placeholder: I split a pane in Code, dragged it onto another, and…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Code
        2. …
  - type: dropdown
    id: area
    attributes:
      label: Where in the app?
      options:
        - Home
        - Agents
        - Code (terminals, panes, files, browser dock)
        - Chat
        - Tasks or a task's own copy (Apply, Discard)
        - Routines
        - Skills
        - Runs (review, Continue, search)
        - Maestro (plans, Running list)
        - Agents together (vibeforge tell, task, reviews)
        - Phone page
        - Voice (dictation, talk-back)
        - Plan limits or tokens
        - Tray, notifications or sounds
        - Ctrl+K or keyboard shortcuts
        - Settings, theme or language
        - Install or Update
        - Something else
  - type: input
    id: version
    attributes:
      label: VibeForge version
      placeholder: "2.13.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your system, and which coding CLIs are installed.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In VibeForge, **Help → Copy diagnostics**, then paste here. It holds your versions, a few settings and the end of VibeForge's own log (no prompts or terminal output). Read it and remove anything private first.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Anything else?
      description: Screenshots, the output of `vibeforge` started from a terminal, or the transcript of the run. Remove anything private first.
